[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cadence-net"
version = "0.18.0"
description = "Research toward general intelligence through local repair, equilibrium detuning and self-reflection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bernhard Mueller" }]
keywords = ["brain", "neurons", "synapses", "connectome", "equilibrium propagation", "local learning", "dopamine"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
accel = ["torch>=2.2"]
apple = ["mlx>=0.20"]
fast = ["numba>=0.60", "scipy>=1.10"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "torch>=2.2", "numba>=0.60", "scipy>=1.10"]


[project.urls]
Homepage = "https://github.com/muellerberndt/cadence"
Documentation = "https://github.com/muellerberndt/cadence/blob/main/docs/index.md"
Issues = "https://github.com/muellerberndt/cadence/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "lean", "benchmarks", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["**/.lake/**", "*.olean", "*.ilean", "*.olean.private", "*.olean.server"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/cadence/record_ports.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["cadence"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "numba", "numba.*", "mlx", "mlx.*"]
ignore_missing_imports = true
