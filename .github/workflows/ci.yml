name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  minimal-install:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel with zero runtime dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/*.whl
          python -m pip check
      - name: Import and settle a column without any optional extras
        run: |
          python - <<'PY'
          from cadence import CorticalColumn, Cortex, __version__
          column = CorticalColumn()
          for event, value in enumerate([2, 2, 2, 0], 1):
              assert column.observe(event, value)['accepted'] is True
          answer = column.query()
          assert answer['qualified'] is True and answer['answer'] > 0.5
          print('cadence', __version__, 'ok:', answer['answer'])
          PY
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
