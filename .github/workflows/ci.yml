name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  minimal-install:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel with zero runtime dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/*.whl
          python -m pip check
      - name: Learn and restore a population brain without optional extras
        run: |
          python -I - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import tomllib
          from cadence import Brain, Cortex, bootstrap, __version__
          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version("cadence-net") == __version__ == declared
          layout = Cortex(seed=2)
          signal = layout.input("signal", shape=(1,))
          base = layout.column("base", patches=4, inputs=signal)
          response = layout.column("response", patches=2, inputs=(signal, base))
          layout.output("answer", shape=(1,), reads=response)
          brain = layout.build()
          examples = [({"signal": [x]}, {"answer": [x]}) for x in (-0.8, 0.8)]
          checks = [({"signal": [x]}, {"answer": [x]}) for x in (-0.4, 0.4)]
          report = bootstrap(brain, examples, checks=checks, max_error=0.15)
          assert report["passed"], report
          assert brain.predict({"signal": [0.4]})["answer"][0] > 0.2
          saved = brain.snapshot()
          restored = Brain.from_snapshot(saved)
          assert restored.snapshot() == saved
          assert restored.predict({"signal": [0.4]}) == brain.predict({"signal": [0.4]})
          assert restored.observe({"signal": [0.3]}, {"answer": [0.3]})["accepted"]
          activity = restored.state
          batch = restored.observe_batch(examples, event_id=1000)
          assert batch["accepted"] and batch["batch_size"] == 2
          assert restored.state == activity
          batch_saved = restored.snapshot()
          resumed = Brain.from_snapshot(batch_saved)
          assert resumed.observe_batch(examples, event_id=1000)["duplicate"]
          assert resumed.snapshot() == batch_saved
          print("cadence", __version__, "population learning and continuation passed")
          PY
      - name: Check installed outcome ownership contract
        run: |
          python -I - <<'PY'
          from cadence import Cortex, Reinforcement
          layout = Cortex(seed=2)
          sensor = layout.input("signal", shape=1)
          values = layout.column(patches=2, inputs=sensor)
          for index, name in enumerate(("left", "right")):
              layout.output(name, shape=(), reads=values, indices=(index,))
          learner = Reinforcement(layout.build(), actions=2, action_input=None,
                                  value_output=("left", "right"))
          choice = learner.act({"signal": [0.25]}, explore=False)
          assert choice["accepted"]
          outcome = dict(reward=1, next_inputs=None, terminal=True,
                         decision_id=choice["decision_id"],
                         executed_action=choice["action"])
          assert learner.feedback(**outcome, learn=False)["stored"]
          saved = learner.snapshot()
          assert learner.feedback(**outcome, learn=False)["duplicate"]
          assert learner.snapshot() == saved
          assert Reinforcement.from_snapshot(saved).snapshot() == saved
          PY

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
