name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  minimal-install:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel with zero runtime dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/*.whl
          python -m pip check
      - name: Learn and restore a population brain without optional extras
        run: |
          python - <<'PY'
          from cadence import Brain, Cortex, __version__
          layout = Cortex(seed=2)
          signal = layout.input("signal", shape=(1,))
          base = layout.column("base", patches=4, inputs=signal)
          observer = layout.observer("observer", patches=2, inputs=signal, observes=base)
          layout.output("answer", shape=(1,), reads=observer)
          brain = layout.build()
          for event in range(40):
              value = (-0.8, 0.8)[event % 2]
              assert brain.observe({"signal": [value]}, {"answer": [value]})["accepted"]
          assert brain.predict({"signal": [0.4]})["answer"][0] > 0.2
          saved = brain.snapshot()
          restored = Brain.from_snapshot(saved)
          assert restored.snapshot() == saved
          assert restored.predict({"signal": [0.4]}) == brain.predict({"signal": [0.4]})
          print("cadence", __version__, "population learning and continuation passed")
          PY

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
