name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  minimal-install:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel with only required dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/*.whl
          python -m pip check
      - name: Run the documented learning and acting loops without optional backends
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          for name in ("docs/patchnet.md", "docs/quickstart.md", "docs/temporal.md",
                       "docs/temporal-memory.md", "docs/architecture.md",
                       "docs/planning.md", "docs/interaction.md", "docs/partitioned.md",
                       "docs/record-patch.md", "docs/build.md", "docs/belief.md",
                       "docs/steering.md", "docs/recursive-settlement.md"):
              page = Path(name).read_text(encoding="utf-8")
              code = "\n\n".join(re.findall(r"```python\n(.*?)```", page, re.S))
              if name.endswith("quickstart.md"):
                  code += "\nassert night['updates'] > 200 and learner.updates == 80\n"
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run([sys.executable, "-c", code], cwd=directory, check=True)
          PY
      - name: Check the Lean audit verifier
        run: python -m unittest discover -s lean -p test_check.py
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install mlx || true
        if: runner.os == 'macOS'
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q
